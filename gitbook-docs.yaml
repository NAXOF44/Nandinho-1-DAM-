$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Nandinho - 1º DAM
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
        - type: space
          key: space-2
          title: Modulos.
          path: modulos
          content:
            directory: ./home/tutoria
    - type: section
      key: section-4
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-4
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog
